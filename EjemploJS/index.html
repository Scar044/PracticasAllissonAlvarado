<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="texto">soy un h1</h1>
    <script>
        //Declarar variable
        let numero1, numero2;

        numero1 = Number (prompt("Ingrese el numero 1: "));
        numero2 = Number (prompt("Ingrese el numero 2: "));

        //Sumar y guardar en la variable sum
        sum = numero1 + numero2;
        //Meter el resultado en h1
        document.getElementById("texto").innerHTML = sum;
    </script>
</body>
</html>
